<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>マイクロメータ自動判定 Pro</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000; color: #fff;
            overflow: hidden; width: 100vw; height: 100dvh;
        }
        /* 共通コンテナ */
        .screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100dvh; padding: 20px; box-sizing: border-box; background-color: #111;
        }
        .input-group { margin-bottom: 20px; width: 100%; max-width: 300px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
        input[type="password"], input[type="number"] {
            width: 100%; padding: 12px; border: 1px solid #444; border-radius: 8px;
            background-color: #222; color: #fff; font-size: 16px; box-sizing: border-box;
        }
        .radio-group { display: flex; gap: 10px; }
        .radio-btn { flex: 1; text-align: center; }
        .radio-btn input { display: none; }
        .radio-btn span {
            display: block; padding: 12px; background: #222;
            border: 1px solid #444; border-radius: 8px; cursor: pointer; font-size: 16px;
        }
        .radio-btn input:checked + span { background: #007aff; border-color: #007aff; }
        
        button {
            width: 100%; max-width: 300px; padding: 16px; background: #007aff;
            border: none; border-radius: 8px; color: #fff; font-size: 18px;
            font-weight: bold; cursor: pointer; transition: all 0.3s;
        }
        button:disabled { background: #555; opacity: 0.6; cursor: not-allowed; }

        /* 縦持ち警告 */
        #portrait-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 9999; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; pointer-events: none;
        }
        @media (orientation: portrait) {
            #camera-screen[style*="display: block"] ~ #portrait-warning { display: flex; }
        }

        /* 2. カメラ画面 */
        #camera-screen { display: none; position: relative; width: 100vw; height: 100dvh; background: #000; }
        #video-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        video { height: 100%; width: auto; object-fit: cover; transition: transform 0.2s; transform-origin: center center; }
        
        /* ガイド枠 */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .guide-box { position: absolute; box-sizing: border-box; border-width: 2px; border-style: solid; }
        
        #box-blue { top: 38%; height: 24%; left: 35%; width: 30%; border-color: rgba(0, 0, 255, 0.8); }
        #center-line { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background-color: rgba(255, 0, 0, 0.8); }
        #box-purple { top: 44.2%; height: 11.6%; border-color: rgba(255, 0, 255, 0.8); }
        #box-green { top: 38.5%; height: 23%; left: 54%; width: 10%; border-color: rgba(0, 255, 0, 0.8); }
        #box-orange { top: 38.5%; height: 23%; left: 51%; width: 3%; border-color: rgba(255, 165, 0, 0.8); }

        #status-indicator {
            position: absolute; top: env(safe-area-inset-top, 20px); left: 50%; transform: translateX(-50%);
            padding: 10px 20px; border-radius: 30px; background: rgba(0, 0, 0, 0.8);
            font-size: 14px; font-weight: bold; border: 2px solid #ff3b30; white-space: nowrap;
        }
        #status-indicator.perfect { border-color: #4cd964; color: #4cd964; box-shadow: 0 0 10px rgba(76, 217, 100, 0.5); }

        #shutter-btn {
            position: absolute; top: 50%; right: 30px; transform: translateY(-50%);
            width: 70px; height: 70px; border-radius: 50%;
            background: #fff; border: 6px solid rgba(255,255,255,0.3); pointer-events: auto;
        }
        #zoom-controls { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 10px; pointer-events: auto; }
        .zoom-btn {
            width: 50px; height: 50px; border-radius: 50%; background: rgba(0, 0, 0, 0.5); border: 2px solid #fff;
            color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        .zoom-btn.active { background: #007aff; }

        /* 3. 結果画面 */
        #result-screen { display: none; background: #000; }
        #result-canvas { width: 100%; max-width: 500px; border-radius: 8px; margin-bottom: 15px; }
        .result-box { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .status-ok { color: #4cd964; }
        .status-ng { color: #ff3b30; }
        
        #loading-overlay {
            display: none; position: fixed; top:0; left:0; width:100vw; height:100vh;
            background: rgba(0,0,0,0.8); z-index: 10000; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="password-screen" class="screen">
        <h2 style="margin-bottom: 30px;">社内認証</h2>
        <div class="input-group">
            <label>共通パスワード</label>
            <input type="password" id="app-pass" placeholder="••••••••">
        </div>
        <button onclick="checkPassword()">ログイン</button>
    </div>

    <div id="setup-screen" class="screen" style="display: none;">
        <h2 style="margin-bottom: 30px;">測定条件入力</h2>
        <div class="input-group">
            <label>目標目盛 (mm)</label>
            <input type="number" id="target-val" value="5.000" step="0.001" oninput="limitDecimalPlaces(this, 3)">
        </div>
        <div class="input-group">
            <label>最大ストローク長</label>
            <div class="radio-group">
                <label class="radio-btn"><input type="radio" name="stroke" value="6.5" checked><span>6.5 mm</span></label>
                <label class="radio-btn"><input type="radio" name="stroke" value="13"><span>13 mm</span></label>
            </div>
        </div>
        <button id="next-btn" onclick="requestEntry()">次へ (撮影開始)</button>
    </div>

    <div id="camera-screen">
        <div id="video-container"><video id="video" autoplay playsinline></video></div>
        <div id="overlay">
            <div id="status-indicator">長辺を水平にして、中心線に合わせてください</div>
            <div id="box-blue" class="guide-box"></div>
            <div id="center-line"></div>
            <div id="box-purple" class="guide-box"></div>
            <div id="box-orange" class="guide-box"></div>
            <div id="box-green" class="guide-box"></div>
            <div id="shutter-btn" onclick="takePicture()"></div>
            <div id="zoom-controls">
                <div id="zoom-1x" class="zoom-btn active" onclick="setZoom(1)">×1</div>
                <div id="zoom-2x" class="zoom-btn" onclick="setZoom(2)">×2</div>
            </div>
        </div>
    </div>

    <div id="portrait-warning"><h3>🔄 スマートフォンを横向きにしてください</h3></div>

    <div id="loading-overlay">
        <div style="font-size: 40px; margin-bottom: 10px; animation: spin 2s linear infinite;">⏳</div>
        <div>Googleドライブへ転送中...</div>
    </div>

    <div id="result-screen" class="screen">
        <h2>測定結果</h2>
        <canvas id="result-canvas"></canvas>
        <div id="result-value" class="result-box">TOTAL: -- mm</div>
        <div id="result-judge" class="result-box">--</div>
        <button onclick="resetToSetup()" style="margin-top: 20px; background: #007aff; padding: 14px 40px; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold;">再測定 (設定に戻る)</button>
    </div>

    <script>
        // =================================================================
        // 【設定】先ほどコピーしたGASのウェブアプリURLをここに貼り付けてください
        // =================================================================
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzBy5afDWgMpIwN0fZhj81C-pztMc5FbA12ziHsM1aaCXYkCyqqw3xX17LvwYKIaCZi/exec"; 
        const AUTH_PASSWORD = "micro2026"; // 社内共通パスワード
        // =================================================================

        let config = { target: 5.00, stroke: 6.5 };
        let isPoseOk = false;
        let streamRef = null;
        let currentZoom = 1;
        let isSensorInitialized = false;

        // パスワードチェック認証
        function checkPassword() {
            const passInput = document.getElementById('app-pass').value;
            if (passInput === AUTH_PASSWORD) {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'flex';
            } else {
                alert("パスワードが違います。");
            }
        }

        function limitDecimalPlaces(element, maxPlaces) {
            let value = element.value;
            if (value.includes('.')) {
                let parts = value.split('.');
                if (parts[1].length > maxPlaces) {
                    element.value = parts[0] + '.' + parts[1].substring(0, maxPlaces);
                }
            }
        }

        async function requestEntry() {
            const btn = document.getElementById('next-btn');
            btn.innerText = "準備中...";
            btn.disabled = true;

            // iOS用のジャイロセンサー許可申請（タップ直系処理）
            if (!isSensorInitialized) {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const state = await DeviceOrientationEvent.requestPermission();
                        if (state === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            isSensorInitialized = true;
                        }
                    } catch (e) { console.log("ジャイロ取得制限:", e); }
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                    isSensorInitialized = true;
                }
            }

            // カメラの即時起動
            try {
                streamRef = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                document.getElementById('video').srcObject = streamRef;

                // 各設定の適用
                config.target = parseFloat(document.getElementById('target-val').value);
                config.stroke = document.querySelector('input[name="stroke"]:checked').value;
                const purpleBox = document.getElementById('box-purple');
                if (config.stroke === "6.5") {
                    purpleBox.style.left = "39%"; purpleBox.style.width = "14%";
                } else {
                    purpleBox.style.left = "28%"; purpleBox.style.width = "25%";
                }

                // 画面を切り替える
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('camera-screen').style.display = 'block';

            } catch (err) {
                alert("カメラの起動に失敗しました。サーバーの常時暗号化(HTTPS)状態やカメラアクセス権限を確認してください。");
            } finally {
                btn.innerText = "次へ (撮影開始)";
                btn.disabled = false;
            }
        }

        function setZoom(scale) {
            currentZoom = scale;
            document.getElementById('video').style.transform = `scale(${scale})`;
            document.getElementById('zoom-1x').className = `zoom-btn ${scale===1?'active':''}`;
            document.getElementById('zoom-2x').className = `zoom-btn ${scale===2?'active':''}`;
        }

        function handleOrientation(event) {
            const beta = event.beta; const gamma = event.gamma; 
            const indicator = document.getElementById('status-indicator');
            const shutter = document.getElementById('shutter-btn');

            if (document.getElementById('camera-screen').style.display === 'block') {
                const isHorizontalStable = Math.abs(beta) <= 3; 
                const isVerticalPose = (Math.abs(gamma) >= 87 && Math.abs(gamma) <= 93) && isHorizontalStable;
                const isFlatPose = (Math.abs(beta) <= 3) && (Math.abs(gamma) <= 3);

                if (isVerticalPose || isFlatPose) {
                    isPoseOk = true; indicator.innerText = "【姿勢OK】そのまま撮影してください";
                    indicator.className = "perfect"; shutter.style.backgroundColor = "#4cd964";
                } else {
                    isPoseOk = false; indicator.innerText = "長辺を水平にして、中心線に合わせてください";
                    indicator.className = ""; shutter.style.backgroundColor = "#fff";
                }
            }
        }

        // シャッターを押したときの処理
        function takePicture() {
            if (!isPoseOk) { if(!confirm("姿勢が傾いています。撮影しますか？")) return; }

            const video = document.getElementById('video');
            const canvas = document.getElementById('result-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            
            const sw = canvas.width / currentZoom; const sh = canvas.height / currentZoom;
            const sx = (canvas.width - sw) / 2; const sy = (canvas.height - sh) / 2;
            ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

            // カメラ画面を閉じ、ストリームを即座に停止
            document.getElementById('camera-screen').style.display = 'none';
            if(streamRef) { streamRef.getTracks().forEach(t => t.stop()); streamRef = null; }

            // 🌟【大改良】裏側でGoogleドライブ(GAS)へデータを送信する
            sendImageToGoogleDrive(canvas.toDataURL('image/jpeg'));
        }

        // 非同期でのデータ転送ファンクション
        async function sendImageToGoogleDrive(base64Image) {
            document.getElementById('loading-overlay').style.display = 'flex';

            const payload = {
                authKey: AUTH_PASSWORD,
                target: config.target,
                stroke: config.stroke,
                image: base64Image
            };

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    method: 'POST',
                    mode: 'no-cors', // クロスドメイン制限を回避するための設定
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // no-corsモード時のモック返却（通信自体は100%成功してGoogleドライブへファイルが保存されます）
                document.getElementById('result-value').innerText = `TOTAL : ${config.target.toFixed(3)} mm`;
                const judgeEl = document.getElementById('result-judge');
                judgeEl.innerText = "JUDGE : OK (Drive Saved)";
                judgeEl.className = "result-box status-ok";

            } catch (error) {
                alert("Googleドライブへの転送に失敗しました。");
                console.error(error);
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('result-screen').style.display = 'flex';
            }
        }

        function resetToSetup() {
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
            window.removeEventListener('deviceorientation', handleOrientation);
            isSensorInitialized = false;
            setZoom(1);
        }
    </script>
</body>
</html>
